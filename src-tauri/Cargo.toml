[package]
name = "open-builder"
version = "2.0.0"
description = "Open Builder is an open-source AI-powered app generator. Build web applications through natural language conversations."
authors = ["Amery2010"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"
tauri-plugin-opener = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
reqwest = { version = "0.13", features = ["stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["io-util", "net", "process", "sync", "time"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2.4.1"
rmcp = { version = "3.1", default-features = false, features = ["client", "server", "transport-child-process", "transport-streamable-http-server"] }
process-wrap = { version = "9.1", features = ["tokio1"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
libc = "0.2"
axum = "0.8"
tokio-util = "0.7"

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = 0
