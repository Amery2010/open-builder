name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        # Unused code is reported by the advisory ESLint step below.
        run: pnpm typecheck --noUnusedLocals false --noUnusedParameters false

      - name: Lint (advisory)
        run: |
          pnpm lint || echo "::warning title=ESLint::Lint issues were found. Review the log above; the build will continue."

      - name: Format check (advisory)
        run: |
          pnpm format:check || echo "::warning title=Prettier::Formatting issues were found. Review the log above; the build will continue."

      - name: Version contract
        run: pnpm version:check

      - name: Workflow contract
        run: pnpm workflow:check

      - name: Unit tests
        run: pnpm test:frontend

      - name: Component tests
        run: pnpm test:components

      - name: Desktop security checks
        run: pnpm security:desktop

      - name: Production build
        run: |
          pnpm build
          pnpm build:check

  rust:
    name: Rust checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust quality
        working-directory: src-tauri
        run: |
          cargo fmt --check || echo "::warning title=Rustfmt::Formatting issues were found. Review the log above; the build will continue."
          cargo clippy --all-targets --all-features
          cargo test --locked
